<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NORMA · Income Distribution by Billing Statement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F2; --panel:#FFFFFF; --side:#16302B; --side-ink:#C9DCD5; --side-hi:#244A41; --ink:#1E2B2B; --ink-2:#4A5A59; --ink-3:#7B8A88; --rule:#D3DBD7; --rule-2:#E7ECE9; --hi:#E6F2EE;
  --accent:#1F6F5C; --accent-ink:#fff; --warn:#B4493A; --warn-bg:#FBEDEA; --ok:#13806F; --ok-bg:#E3F4EF; --draft:#8A6A12; --draft-bg:#FBF3DC;
  --c-ae:#13806F; --c-ns:#233F8C; --c-res:#C0693A; --c-reb:#B5577A; --c-pass:#8A9A9E; --c-tax:#6B5B95;
  --font:"Archivo","Segoe UI",Arial,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121A1B; --panel:#1A2425; --side:#0E1617; --side-ink:#A9BDB6; --side-hi:#1D3631; --ink:#E7EEEC; --ink-2:#B3C1BE; --ink-3:#86958F; --rule:#33403F; --rule-2:#253030; --hi:#1E3530;
  --accent:#4CC2A9; --accent-ink:#0E1A18; --warn:#E07B67; --warn-bg:#3A2420; --ok:#4CC2A9; --ok-bg:#183630; --draft:#E2C25C; --draft-bg:#352D14;
  --c-ae:#2FA58F; --c-ns:#6E8CE0; --c-res:#DD8752; --c-reb:#D07495; --c-pass:#7F9094; --c-tax:#9A88C6; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121A1B; --panel:#1A2425; --side:#0E1617; --side-ink:#A9BDB6; --side-hi:#1D3631; --ink:#E7EEEC; --ink-2:#B3C1BE; --ink-3:#86958F; --rule:#33403F; --rule-2:#253030; --hi:#1E3530;
  --accent:#4CC2A9; --accent-ink:#0E1A18; --warn:#E07B67; --warn-bg:#3A2420; --ok:#4CC2A9; --ok-bg:#183630; --draft:#E2C25C; --draft-bg:#352D14;
  --c-ae:#2FA58F; --c-ns:#6E8CE0; --c-res:#DD8752; --c-reb:#D07495; --c-pass:#7F9094; --c-tax:#9A88C6; color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
aside{background:var(--side);color:var(--side-ink);padding:18px 12px;overflow:auto}
.logo{font-stretch:75%;font-weight:800;font-size:22px;color:#fff;letter-spacing:.01em;padding:0 8px}
.logo small{display:block;font-stretch:100%;font-weight:500;font-size:12px;color:var(--side-ink);letter-spacing:0;margin-top:2px}
.navsec{font-size:12px;color:#7FA096;margin:22px 8px 6px;font-weight:600}
aside a{display:flex;justify-content:space-between;align-items:center;color:var(--side-ink);text-decoration:none;padding:7px 10px;border-radius:6px;font-weight:500}
aside a:hover{background:var(--side-hi);color:#fff}
aside a.on{background:var(--side-hi);color:#fff;font-weight:650;box-shadow:inset 3px 0 0 #4CC2A9}
aside a .n{font-size:12px;color:#7FA096}
.side-foot{margin-top:28px;padding:0 8px;display:flex;flex-direction:column;gap:8px}
.side-foot button{background:none;border:1px solid #2E4D46;color:var(--side-ink);border-radius:6px;padding:6px 10px;cursor:pointer;text-align:left}

main{overflow:auto;min-width:0}
.page{padding:22px clamp(14px,3vw,36px) 70px;max-width:1500px}
.crumbs{color:var(--ink-3);font-size:13px;margin-bottom:4px}
.crumbs a{color:var(--ink-3);text-decoration:none}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
h1{font-stretch:80%;font-weight:760;font-size:28px;line-height:1.1;margin:0}
h2{font-size:16px;font-weight:700;margin:0}
.sub{color:var(--ink-2);margin:4px 0 0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:600;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn)}
.btn.sm{padding:4px 9px;font-size:13px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;margin-bottom:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule-2);flex-wrap:wrap}
.card-b{padding:14px 16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);font-weight:600}
label.f .hint{font-weight:400;color:var(--ink-3);font-size:12px}
input.i,select.i,textarea.i{border:1px solid var(--rule);border-radius:6px;padding:7px 9px;background:var(--panel);font-size:14px;font-weight:400;color:var(--ink);width:100%;min-width:0}
input.i[readonly]{background:var(--rule-2);color:var(--ink-2)}
input.num{text-align:right}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);font-weight:500;cursor:pointer}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 18px}
.kv div small{display:block;color:var(--ink-3);font-size:12px}
.kv div b{font-weight:650}

.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;background:var(--panel);font-size:13.5px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--rule-2);text-align:left;vertical-align:middle}
table.t thead th{font-size:12px;color:var(--ink-3);font-weight:650;background:var(--panel);position:sticky;top:0;border-bottom:1px solid var(--rule);white-space:nowrap}
table.t td.r,table.t th.r{text-align:right;white-space:nowrap}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover{background:var(--hi)}
table.t tfoot td{font-weight:700;border-top:2px solid var(--rule);background:var(--panel)}
table.t tr.grp td{background:var(--rule-2);font-weight:650;font-size:12.5px;color:var(--ink-2)}
table.edit td{padding:5px 6px}
table.edit input.i, table.edit select.i{padding:6px 7px;font-size:13.5px}
.muted{color:var(--ink-3)}
.mono{font-family:Consolas,Menlo,monospace;font-size:12.5px}
.tag{display:inline-block;font-size:12px;font-weight:650;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.posted{background:var(--ok-bg);color:var(--ok)} .tag.draft{background:var(--draft-bg);color:var(--draft)} .tag.bad{background:var(--warn-bg);color:var(--warn)}
.tag.t-house{background:#E3E9F7;color:#233F8C} .tag.t-int{background:#DDF1EB;color:#13684F} .tag.t-ext{background:#F4E4EC;color:#8E3B5E} .tag.t-emp{background:#F6E8DA;color:#8A4A1C}
:root[data-theme="dark"] .tag.t-house,:root[data-theme="dark"] .tag.t-int,:root[data-theme="dark"] .tag.t-ext,:root[data-theme="dark"] .tag.t-emp{background:var(--rule-2);color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.t-house,:root:not([data-theme="light"]) .tag.t-int,:root:not([data-theme="light"]) .tag.t-ext,:root:not([data-theme="light"]) .tag.t-emp{background:var(--rule-2);color:var(--ink)}}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filters .i{width:auto}
.filters input.i{min-width:240px}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--rule);border-radius:10px;background:var(--panel);margin-bottom:16px;overflow:hidden}
.kpi{padding:12px 16px;border-right:1px solid var(--rule-2)}
.kpi:last-child{border-right:0}
.kpi b{display:block;font-size:19px;font-stretch:88%}
.kpi small{display:flex;gap:6px;align-items:center;color:var(--ink-3);font-size:12.5px}
.kpi i{width:9px;height:9px;border-radius:2px;display:inline-block}
.bar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--rule-2);min-width:120px}
.bar span{height:100%}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin:4px 0 14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:650;color:var(--ink-3);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.je{margin-bottom:18px}
.je .card-h b{font-size:14.5px}
.alert{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13.5px}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.info{background:var(--hi);color:var(--ink-2)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.doc{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:22px 26px;max-width:860px;margin-bottom:18px}
.doc h3{font-stretch:85%;font-size:20px;margin:0 0 2px}
.doc .meta{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--ink-2);margin:10px 0 16px;font-size:13.5px}

dialog{border:1px solid var(--rule);border-radius:12px;padding:0;background:var(--panel);color:var(--ink);width:min(640px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,20,18,.45)}
dialog form{display:flex;flex-direction:column;max-height:90vh}
dialog .dh{padding:14px 18px;border-bottom:1px solid var(--rule-2);display:flex;justify-content:space-between;align-items:center}
dialog .db{padding:16px 18px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
dialog .db .full{grid-column:1 / -1}
dialog .df{padding:12px 18px;border-top:1px solid var(--rule-2);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transform:translateY(8px);transition:all .2s;z-index:50;pointer-events:none;max-width:360px}
.toast.show{opacity:1;transform:none}
.hier{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 16px;font-size:12.5px;color:var(--ink-3)}
.hier span{border:1px solid var(--rule);border-radius:99px;padding:3px 10px;background:var(--panel);color:var(--ink-2)}
.hier span.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.hier i{font-style:normal}
.tag.mode{background:var(--rule-2);color:var(--ink-2)}
td.neg,td.neg b{color:var(--warn)}
table.t.nw td,table.t.nw th{white-space:nowrap}
table.t.nw tr.grp td{white-space:normal}
table.t tr.grp td a{color:inherit}

/* mode switch */
.modesw{display:flex;background:rgba(255,255,255,.07);border-radius:8px;padding:3px;margin:16px 0 4px}
.modesw button{flex:1;border:0;background:none;color:var(--side-ink);padding:7px 6px;border-radius:6px;cursor:pointer;font-weight:650;font-size:13px}
.modesw button[aria-pressed="true"]{background:#4CC2A9;color:#0E1A18}
.modesw.sm{margin:0;flex:0 0 auto}.modesw.sm button{padding:6px 9px;font-size:12px}
#navDemo{display:none}
body.demo-mode #navDemo{display:block} body.demo-mode #navFull{display:none}
/* demo home */
.demo-hero{padding:18px 0 8px;max-width:760px}
.demo-eyebrow{font-stretch:75%;font-weight:800;font-size:18px;color:var(--accent)}
.demo-h1{font-stretch:75%;font-weight:800;font-size:clamp(34px,5vw,56px);line-height:1;margin:4px 0 12px;letter-spacing:-.01em}
.demo-lede{font-size:19px;color:var(--ink-2);margin:0;max-width:52ch}
.demo-flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:26px 0 8px}
.demo-flow div{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;min-width:130px}
.demo-flow div b{display:block;font-size:14.5px}.demo-flow div span{font-size:12.5px;color:var(--ink-3)}
.demo-flow i{align-self:center;font-style:normal;color:var(--ink-3)}
.demo-h2{font-stretch:85%;font-size:22px;margin:34px 0 14px}
.scen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.scen{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:18px 18px 14px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s;position:relative}
.scen:hover{border-color:var(--accent);transform:translateY(-2px)}
.scen-n{position:absolute;top:14px;right:16px;font-stretch:75%;font-weight:800;font-size:28px;color:var(--rule)}
.scen b{font-stretch:85%;font-size:21px;line-height:1.1}
.scen-sub{color:var(--accent);font-weight:650;font-size:13.5px}
.scen p{margin:8px 0 12px;color:var(--ink-2);font-size:13.5px;flex:1}
.scen-foot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--rule-2);padding-top:10px;font-size:12.5px;color:var(--ink-3)}
.demo-note{margin-top:22px}
/* guided flow */
.demo-sub{font-stretch:100%;font-weight:500;font-size:16px;color:var(--ink-3)}
.stepper{display:flex;align-items:center;gap:6px;margin:4px 0 16px;flex-wrap:wrap}
.stepper a{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink-3);font-weight:650;padding:8px 14px 8px 8px;border-radius:99px;border:1px solid var(--rule);background:var(--panel)}
.stepper a span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--rule-2);color:var(--ink-2);font-size:13px}
.stepper a.done span{background:var(--ok-bg);color:var(--ok)}
.stepper a.on{border-color:var(--accent);color:var(--ink)} .stepper a.on span{background:var(--accent);color:var(--accent-ink)}
.stepper i{flex:0 0 18px;height:2px;background:var(--rule)}
.bs-switch{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.bs-switch a{display:flex;flex-direction:column;text-decoration:none;color:var(--ink-2);border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:8px 14px}
.bs-switch a span{font-size:12px;color:var(--ink-3)}
.bs-switch a[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--ink)}
.bs-switch-note{font-size:12.5px;margin-left:4px}
.demo-body{max-width:1100px}
.explain{background:var(--hi);border-left:4px solid var(--accent);padding:12px 16px;border-radius:8px;margin-bottom:16px;color:var(--ink);font-size:15px}
.explain.strong{font-size:16px}
.demo-kv{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.demo-kv div b{font-size:15.5px}
table.demo-t{font-size:14.5px}
table.demo-t tr.cur td{background:var(--hi)}
.tree{display:flex;flex-direction:column;gap:0}
.tree-root{display:flex;gap:12px;align-items:baseline}.tree-root b{font-size:17px}.tree-root span{color:var(--ink-3)}
.tree-leaf{display:flex;gap:12px;align-items:baseline;text-decoration:none;color:var(--ink);margin-left:14px;padding:10px 0 4px 20px;border-left:2px solid var(--rule);position:relative}
.tree-leaf::before{content:"";position:absolute;left:0;top:22px;width:14px;border-top:2px solid var(--rule)}
.tree-leaf b{color:var(--accent)} .tree-leaf span{color:var(--ink-2)}
.tree-leaf:hover b{text-decoration:underline}
.portion{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.portion-cell{flex:1 1 150px;border:1px solid var(--rule);border-radius:10px;padding:10px 14px}
.portion-cell small{display:block;color:var(--ink-3)} .portion-cell b{font-size:20px;font-stretch:88%}
.portion-cell.hl{border-color:var(--accent);background:var(--hi)}
.portion-bar{display:flex;height:30px;border-radius:6px;overflow:hidden;background:var(--rule-2);font-size:12px;font-weight:650}
.portion-bar span{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;color:#fff}
.p-here{background:var(--accent)} .p-other{background:var(--c-pass)} .p-rem{background:transparent;color:var(--ink-3)!important;border:1px dashed var(--ink-3);border-radius:0 6px 6px 0}
.bd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.bd-card{margin-bottom:0}
.ledger{display:flex;flex-direction:column}
.lg-row{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:14.5px}
.lg-row b{font-weight:600;white-space:nowrap}
.lg-row.ind > span:first-child{padding-left:16px;color:var(--ink-2)}
.lg-row.sub{border-top:1px solid var(--ink-3);margin-top:3px;padding-top:7px;font-weight:700}
.lg-row.sub b{font-weight:750}
.lg-row.ae,.lg-row.ns{border-radius:6px;padding:8px 10px;margin:4px -10px;font-weight:700}
.lg-row.ae{background:color-mix(in srgb,var(--c-ae) 14%,transparent)} .lg-row.ae b{color:var(--c-ae)}
.lg-row.ns{background:color-mix(in srgb,var(--c-ns) 14%,transparent)} .lg-row.ns b{color:var(--c-ns)}
.lg-row.small{font-size:14px;border-bottom:1px solid var(--rule-2);padding:8px 0}
.lg-row.pending b{color:var(--draft)}
.lg-hd{font-size:12.5px;color:var(--ink-3);font-weight:650;margin-top:6px}
.lg-note{font-size:13px;color:var(--ink-3);padding:5px 0;font-style:italic}
.info{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--ink-3);color:var(--ink-3);font-size:10px;font-weight:700;font-style:italic;cursor:help;position:relative;vertical-align:1px;font-family:Georgia,serif}
.info:hover::after,.info:focus::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:240px;background:var(--ink);color:var(--bg);font:500 12.5px/1.35 var(--font);font-style:normal;padding:7px 10px;border-radius:6px;z-index:30;white-space:normal;text-align:left}
.si-card{margin-top:14px}
.si-flow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center}
.si-arrow{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;color:var(--ink-2);background:var(--hi);border-radius:10px;padding:14px}
.si-arrow i{font-style:normal;font-size:22px;color:var(--accent)}
.method-card{border:2px solid var(--c-reb);border-radius:12px;padding:18px 20px;margin-bottom:16px;background:var(--panel);position:relative}
.method-tag{position:absolute;top:-11px;left:16px;background:var(--c-reb);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}
.method-card h2{font-stretch:85%;font-size:22px;margin:4px 0 12px}
.method-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.method-grid small{display:block;color:var(--ink-3)} .method-grid b{display:block;font-size:22px;font-stretch:88%;margin:2px 0} .method-grid span{color:var(--ink-2);font-size:13.5px}
.method-arrow{font-size:28px;color:var(--c-reb)}
.method-foot{margin:14px 0 0;font-weight:700;color:var(--c-reb)}
.warn-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:16px}
.warn-card{background:var(--draft-bg);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--ink)}
.warn-card b{color:var(--draft);font-size:13px}
.detail-wrap{margin-top:18px}
.detail-wrap #detBox{margin-top:14px}
.result-hd{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.result-hd h2{font-stretch:85%;font-size:22px}
.result-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rc{border-radius:14px;padding:20px 22px;color:#fff}
.rc small{display:flex;gap:6px;align-items:center;font-size:14px;opacity:.9}
.rc .info{border-color:rgba(255,255,255,.7);color:#fff}

.rc span{opacity:.85}

.result-bar{display:flex;height:16px;border-radius:99px;overflow:hidden;margin:12px 0 16px;background:var(--rule-2);font-size:11px;font-weight:700;color:#fff}

@media (max-width:980px){

  .mobnav{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--side);color:#fff}

  .kpi{border-bottom:1px solid var(--rule-2)}

}

let bsFilter={q:'',type:'',status:'',client:'',group:true};
function bsList(){
  const rows=DB.billingStatements.map(bs=>({bs,so:soOf(bs),r:compute(bs)}));
  page(`<div class="head"><div><h1>Income distribution</h1><p class="sub">Income distribution is calculated per billing statement. A client can have many sales orders, and each sales order can be billed in several statements; each one is calculated, posted and journalised on its own.</p></div>
    <div class="btns"><a class="btn" href="#/orders/new">New sales order</a><a class="btn primary" href="#/statements/new">New billing statement</a></div></div>
    ${hierarchy()}
    <div class="kpis" id="kpis"></div>
    <div class="filters">
      <input class="i" id="fq" type="search" placeholder="Search BS no., client, SO no. or AE" value="${esc(bsFilter.q)}">
      <select class="i" id="fc"><option value="">All clients</option>${[...new Set(rows.map(x=>x.so.clientCode))].map(c=>client(c)).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.code}" ${bsFilter.client===c.code?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
      <select class="i" id="ft"><option value="">All account types</option>${Object.entries(TYPE_LABEL).map(([k,v])=>`<option value="${k}" ${bsFilter.type===k?'selected':''}>${v}</option>`).join('')}</select>
      <select class="i" id="fs"><option value="">Any status</option><option value="draft" ${bsFilter.status==='draft'?'selected':''}>Draft</option><option value="posted" ${bsFilter.status==='posted'?'selected':''}>Posted</option></select>
      <label class="chk" style="margin-left:4px"><input type="checkbox" id="fg" ${bsFilter.group?'checked':''}> Group by client</label>
    </div>
    <div class="card"><div class="tw"><table class="t nw"><thead><tr><th>Billing statement</th><th>Date</th><th>Client</th><th>Sales order</th><th>AE / employee</th><th>Account</th><th>Mode</th><th>Route</th><th class="r">Lines</th><th class="r">Billing amount</th><th class="r">AE income</th><th class="r">North Star income</th><th>Split</th><th>Status</th></tr></thead><tbody id="bsbody"></tbody></table></div></div>
    <p class="muted">Group totals and the figures above add up the individual statement results. Nothing is recalculated at client or sales-order level.</p>`);
  const draw=()=>{
    const q=bsFilter.q.toLowerCase();
    const f=rows.filter(({bs,so,r})=>{ const cl=r.C.client; const hay=[bs.no,cl.name,cl.code,so.no,r.C.ae?r.C.ae.name+' '+r.C.ae.person:'',(siOf(bs)||{}).no||''].join(' ').toLowerCase();
      return (!q||hay.includes(q))&&(!bsFilter.type||cl.type===bsFilter.type)&&(!bsFilter.status||bs.status===bsFilter.status)&&(!bsFilter.client||so.clientCode===bsFilter.client); });
    const sum=(arr,k)=>arr.reduce((a,x)=>a+x.r.T[k],0);
    $('kpis').innerHTML=`<div class="kpi"><b>${f.length}</b><small>Billing statements</small></div>
      <div class="kpi"><b>${P(sum(f,'bs'))}</b><small>Billed on statements</small></div>
      <div class="kpi"><b>${P(sum(f,'ae'))}</b><small><i style="background:var(--c-ae)"></i>AE / employee income</small></div>
      <div class="kpi"><b>${P(sum(f,'reserve'))}</b><small><i style="background:var(--c-res)"></i>Staff error reserve</small></div>
      <div class="kpi"><b>${P(sum(f,'accrued'))}</b><small><i style="background:var(--c-ns)"></i>North Star income</small></div>`;
    const row=({bs,so,r})=>`<tr class="click" data-id="${bs.id}"><td style="white-space:nowrap"><b>${esc(bs.no)}</b>${siOf(bs)?`<div class="muted mono">↔ ${esc(siOf(bs).no)}</div>`:''}</td><td style="white-space:nowrap">${esc(bs.date)}</td>
      <td><a href="#/clients-summary/${encodeURIComponent(so.clientCode)}" data-stop>${esc(r.C.client.name)}</a><div class="muted mono">${esc(r.C.client.code)}</div></td>
      <td style="white-space:nowrap"><a href="#/orders/${so.id}" data-stop>${esc(so.no)}</a></td><td>${aeLabel(r.C)}</td><td>${typeTag(r.C.client.type)}</td><td>${modeTag(so.mode)}</td><td>${routeOf(bs.lines)}</td>
      <td class="r">${bs.lines.length}</td><td class="r">${m(r.T.bs)}</td><td class="r">${m(r.T.ae)}</td><td class="r"><b>${m(r.T.accrued)}</b></td><td>${splitBar(r.T)}</td>
      <td>${statusTag(bs.status)}${r.je.every(j=>j.ok)?'':' <span class="tag bad">Unbalanced</span>'}</td></tr>`;
    let html='';
    if(!f.length) html=`<tr><td colspan="14" class="empty">No billing statements match. Clear the filters, or create a statement from a sales order.</td></tr>`;
    else if(bsFilter.group){
      const groups=new Map(); for(const x of f){ const k=x.so.clientCode; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(x); }
      for(const [code,list] of [...groups.entries()].sort((a,b)=>(client(a[0])||{}).name.localeCompare((client(b[0])||{}).name))){
        const cl=client(code)||{};
        list.sort((a,b)=>a.so.no.localeCompare(b.so.no)||a.bs.no.localeCompare(b.bs.no));
        html+=`<tr class="grp"><td colspan="9"><a href="#/clients-summary/${encodeURIComponent(code)}">${esc(cl.name)}</a> · ${list.length} statement${list.length>1?'s':''} on ${new Set(list.map(x=>x.so.id)).size} sales order${new Set(list.map(x=>x.so.id)).size>1?'s':''}</td><td class="r">${m(sum(list,'bs'))}</td><td class="r">${m(sum(list,'ae'))}</td><td class="r">${m(sum(list,'accrued'))}</td><td colspan="2" class="muted">Sum of statements</td></tr>`;
        html+=list.map(row).join('');
      }
    } else html=f.sort((a,b)=>b.bs.no.localeCompare(a.bs.no)).map(row).join('');
    $('bsbody').innerHTML=html;
    $('bsbody').querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=e=>{ if(e.target.closest('[data-stop]')) return; location.hash='#/statements/'+tr.dataset.id; });
  };
  draw();
  $('fq').oninput=e=>{ bsFilter.q=e.target.value; draw(); };
  $('fc').onchange=e=>{ bsFilter.client=e.target.value; draw(); };
  $('ft').onchange=e=>{ bsFilter.type=e.target.value; draw(); };
  $('fs').onchange=e=>{ bsFilter.status=e.target.value; draw(); };
  $('fg').onchange=e=>{ bsFilter.group=e.target.checked; draw(); };
}

/* ======================= BILLING STATEMENT DETAIL ======================= */
let bsTab='dist';
function bsView(id){
  const bs=bsById(id); if(!bs){ page('<div class="empty">That billing statement no longer exists. <a href="#/statements">Back to income distribution</a></div>'); return; }
  const so=soOf(bs), r=compute(bs), C=r.C, T=r.T, draft=bs.status==='draft', si=siOf(bs);
  const siblings=bsOfSO(so.id);
  const warns=[...r.warn,...overbillWarnings(bs)];
  page(`<div class="crumbs"><a href="#/statements">Income distribution</a> / <a href="#/clients-summary/${encodeURIComponent(so.clientCode)}">${esc(C.client.name)}</a> / <a href="#/orders/${so.id}">${esc(so.no)}</a> / ${esc(bs.no)}</div>
  <div class="head"><div><h1>${esc(bs.no)} ${statusTag(bs.status)}</h1><p class="sub">${esc(C.client.name)} · ${esc(so.no)} · ${typeTag(C.client.type)} ${C.ae?'· '+esc(C.ae.name)+(C.ae.person?' ('+esc(C.ae.person)+')':''):''}</p></div>
    <div class="btns">
      ${draft?`<a class="btn" href="#/statements/${bs.id}/edit">Edit</a><button class="btn primary" id="bPost" ${r.je.every(j=>j.ok)?'':'disabled'}>Post statement</button><button class="btn danger" id="bDel">Delete</button>`:`<button class="btn" id="bUnpost">Return to draft</button>`}
      <a class="btn" href="#/statements/new/${so.id}">New statement for ${esc(so.no)}</a>
    </div></div>
  ${warns.map(w=>`<div class="alert warn">${esc(w)}</div>`).join('')}
  ${!draft?`<div class="alert info">Posted ${esc((bs.postedAt||'').slice(0,10))}. This statement${si?' and '+esc(si.no):''} use the rates and rules locked at posting (${C.rate}% commission, ROE ${C.settings.roe}). Other statements on ${esc(so.no)} are not affected.</div>`:''}
  <div class="card"><div class="card-b kv">
    <div><small>Billing statement</small><b>${esc(bs.no)}</b></div>
    <div><small>Client</small><b><a href="#/clients-summary/${encodeURIComponent(so.clientCode)}">${esc(C.client.name)}</a></b></div>
    <div><small>Client code</small><b class="mono">${esc(C.client.code)}</b></div>
    <div><small>Sales order</small><b><a href="#/orders/${so.id}">${esc(so.no)}</a></b><span class="muted"> · statement ${siblings.findIndex(x=>x.id===bs.id)+1} of ${siblings.length}</span></div>
    <div><small>AE / employee</small><b>${C.ae?esc(C.ae.code+' '+C.ae.name):'—'}</b>${C.ae&&C.ae.person?`<div class="muted">${esc(C.ae.person)}</div>`:''}</div>
    <div><small>Account type</small><b>${typeTag(C.client.type)}</b></div>
    <div><small>Transaction mode</small><b>${MODES[so.mode]||'—'}</b></div>
    <div><small>Package type</small><b>${esc(so.packageType||'—')}</b></div>
    <div><small>Route</small><b>${routeOf(bs.lines)}</b><div class="muted">${esc(so.route||'')}</div></div>
    <div><small>Pax on this statement</small><b>${paxOf(bs.lines)}</b><span class="muted"> of ${so.pax||'—'} booked</span></div>
    <div><small>Date</small><b>${esc(bs.date)}</b></div>
    <div><small>Payment</small><b>${bs.payment==='card'?'Credit card':'Cash / bank'}</b>${bs.payment==='card'?`<div class="muted">${OPT.cc[bs.ccMode]}</div>`:''}</div>
    <div><small>Commission rate</small><b>${C.rate}%</b></div>
    <div><small>Withholding agent (TWA)</small><b>${C.client.twa?'Yes':'No'}</b></div>
    <div><small>Companion service invoice</small><b>${si?esc(si.no):'None'}</b></div>
    <div><small>Rebaters</small><b>${C.rebaters.length?C.rebaters.map(x=>esc(x.code)).join(', '):'None'}</b></div>
  </div>${bs.notes?`<div class="card-b muted" style="border-top:1px solid var(--rule-2)">${esc(bs.notes)}</div>`:''}</div>
  <div class="kpis">
    <div class="kpi"><b>${P(T.bs)}</b><small>Billing statement</small></div>
    <div class="kpi"><b>${si?P(T.si):'—'}</b><small>${si?'Service invoice '+esc(si.no):'No service invoice'}</small></div>
    <div class="kpi"><b>${P(T.ae)}</b><small><i style="background:var(--c-ae)"></i>AE / employee income</small></div>
    <div class="kpi"><b>${P(T.reserve)}</b><small><i style="background:var(--c-res)"></i>Staff error reserve</small></div>
    <div class="kpi"><b>${P(T.accrued)}</b><small><i style="background:var(--c-ns)"></i>North Star income</small></div>
  </div>
  <div class="tabs" role="tablist">${[['dist','Income distribution'],['si','Companion service invoice'],['je','Journal entries'],['pay','Payables'],['docs','Documents']].map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${bsTab===k}">${l}</button>`).join('')}</div>
  <div id="tabp"></div>`);
  const drawTab=()=>{ $('tabp').innerHTML= bsTab==='je'?jeHTML(r.je): bsTab==='pay'?payHTML(r): bsTab==='docs'?docsHTML(bs,so,r): bsTab==='si'?siHTML(bs,r): distHTML(r); document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===bsTab)); };
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ bsTab=b.dataset.t; drawTab(); });
  drawTab();
  if(draft){
    $('bPost').onclick=()=>{ postBS(bs); save(); toast(bs.no+' posted. Other statements on '+so.no+' are unchanged.'); route(); };
    $('bDel').onclick=()=>{ if(confirm('Delete '+bs.no+(si?' and its service invoice '+si.no:'')+'? This cannot be undone.')){ DB.billingStatements=DB.billingStatements.filter(x=>x!==bs); DB.serviceInvoices=DB.serviceInvoices.filter(x=>x.bsId!==bs.id); save(); toast(bs.no+' deleted'); location.hash='#/orders/'+so.id; } };
  } else $('bUnpost').onclick=()=>{ bs.status='draft'; delete bs.snapshot; save(); toast(bs.no+' returned to draft. It now uses the current rules and rates.'); route(); };
}
function distHTML(r){
  const L=r.lines;
  const yes=l=>l.comm?'<span class="tag posted">Yes</span>':'<span class="tag draft">No</span>';
  const cols=[['Selling','sp'],['Card surcharge','cc'],['Supplier cost','cost'],['Base fare','baseFare'],['Pax','pax','n'],['Tickets','tickets','n'],['Commissionable','comm','yn'],['Gross margin','gm'],['IPP','ipp'],['DTE','dte'],['Admin fee','admCharged'],['Rebates','rebT'],['Supplier CWT','pwt'],['Net margin','nm'],['VAT','vat'],['Net distributable','ndm'],['AE share','share'],['Service fee allocation','sfShare'],['AE income (net)','aeNet'],['Staff error','reserve'],['North Star final','accrued']];
  const cell=(l,c)=> c[2]==='yn'?yes(l): c[2]==='n'?(l[c[1]]||'<span class="muted">–</span>') : (l[c[1]]?m(l[c[1]]):'<span class="muted">–</span>');
  const tot=c=> c[2]==='yn'?'': c[2]==='n'?L.reduce((a,l)=>a+(+l[c[1]]||0),0) : m(L.reduce((a,l)=>a+(+l[c[1]]||0),0));
  return `<div class="card"><div class="card-h"><h2>Product lines and income distribution</h2><span class="muted">This statement only. Amounts in ₱.</span></div>
  <div class="tw"><table class="t"><thead><tr><th style="min-width:250px">Product / supplier / description</th>${cols.map(c=>`<th class="r">${c[0]}</th>`).join('')}</tr></thead><tbody>
  ${L.map(l=>`<tr><td><b>${esc(l.desc||PRODUCTS[l.product])}</b><div class="muted">${PRODUCTS[l.product]} · ${esc(l.sup.short||l.sup.name||'—')}</div>${l.soLineId?'':'<div class="muted">Not on the sales order</div>'}</td>${cols.map(c=>`<td class="r">${cell(l,c)}</td>`).join('')}</tr>`).join('')}
  </tbody><tfoot><tr><td>Statement total</td>${cols.map(c=>`<td class="r">${tot(c)}</td>`).join('')}</tr></tfoot></table></div></div>
  <p class="muted">Rules for ${TYPE_LABEL[r.C.client.type]} accounts: rebates – ${OPT.rebate[r.C.rule.rebate]}; admin fee – ${OPT.adm[r.C.rule.adm]}; DTE – ${OPT.dte[r.C.rule.dte]}; domestic lines – ${OPT.domestic[r.C.rule.domestic]}. The AE's service-fee entitlement from this statement's companion invoice is allocated to its first international line, as in the workbook.</p>`;
}
function siHTML(bs,r){
  const si=r.C.si;
  if(!si) return `<div class="card"><div class="empty"><b style="color:var(--ink)">No companion service invoice</b><br>This billing statement has no service fees, so the AE has no service-fee entitlement on it.${bs.status==='draft'?`<br><br><a class="btn" href="#/statements/${bs.id}/edit">Add a service invoice</a>`:''}</div></div>`;
  const fees=r.fees, S=r.C.settings;
  return `<div class="card"><div class="card-h"><div><h2>${esc(si.no)}</h2><span class="muted">Companion to ${esc(bs.no)} · dated ${esc(si.date)}</span></div><span class="tag posted">Linked 1 : 1</span></div>
  <div class="tw"><table class="t"><thead><tr><th>Service fee</th><th class="r">Service fee</th><th class="r">Card surcharge</th><th class="r">Billed</th><th class="r">VAT ${S.vat}%</th><th class="r">Net service fee</th><th class="r">Withheld ${S.ewt}%</th><th class="r">AE entitlement</th></tr></thead><tbody>
  ${fees.map(f=>`<tr><td>${SF_TYPES[f.type]}${f.ent?'':`<div class="muted">${f.type==='sf_air_intl'||f.type==='sf_hotel'?'No AE share for this account type':'Not shared with the AE'}</div>`}</td><td class="r">${m(f.amount)}</td><td class="r">${m(f.cc)}</td><td class="r">${m(f.billed)}</td><td class="r">${m(f.vat)}</td><td class="r">${m(f.net)}</td><td class="r">${m(f.ewt)}</td><td class="r"><b>${m(f.ent)}</b></td></tr>`).join('')}
  </tbody><tfoot><tr><td>Total</td><td class="r">${m(fees.reduce((a,f)=>a+(+f.amount||0),0))}</td><td class="r">${m(fees.reduce((a,f)=>a+f.cc,0))}</td><td class="r">${m(r.T.si)}</td><td class="r">${m(fees.reduce((a,f)=>a+f.vat,0))}</td><td class="r">${m(fees.reduce((a,f)=>a+f.net,0))}</td><td class="r">${m(r.T.ewt)}</td><td class="r">${m(r.T.sfEnt)}</td></tr></tfoot></table></div></div>
  <p class="muted">AE entitlement = international service fee ÷ ${1+S.vat/100} × ${r.C.rate}%. It is paid through ${esc(bs.no)}'s sales journal and reduces North Star's share on that statement only.</p>`;
}
function jeHTML(js){
  return js.map(j=>`<div class="card je"><div class="card-h"><b>${esc(j.title)}</b>${j.ok?'<span class="tag posted">Balanced</span>':`<span class="tag bad">Out by ${P(Math.abs(j.dr-j.cr))}</span>`}</div><div class="tw"><table class="t"><thead><tr><th>GL</th><th>Account</th><th>Subsidiary ledger</th><th class="r">Debit</th><th class="r">Credit</th><th>Memo</th></tr></thead><tbody>
  ${j.lines.map(x=>`<tr><td class="mono">${x.gl}</td><td>${esc(glName(x.gl))}</td><td>${esc(x.sl)}</td><td class="r">${x.dr?m(x.dr):''}</td><td class="r">${x.cr?m(x.cr):''}</td><td class="muted">${esc(x.memo)}</td></tr>`).join('')}
  </tbody><tfoot><tr><td colspan="3">Total</td><td class="r">${m(j.dr)}</td><td class="r">${m(j.cr)}</td><td></td></tr></tfoot></table></div></div>`).join('');
}
function payHTML(r){
  const grp=new Map(); const add=(who,gl,amt,what)=>{ if(Math.abs(amt)<0.005) return; const k=who+'|'+gl; const x=grp.get(k)||{who,gl,amt:0,what}; x.amt+=amt; grp.set(k,x); };
  for(const l of r.lines){ add((l.intl?l.sup.payeeIntl:l.sup.payeeDom)||l.sup.name,l.sup.apGL,l.cost,'Supplier'); for(const b of l.reb) add(b.code+' '+b.name,'211108',b.amt,'Rebater'); if(l.reserve) add(l.air?'OPS-IATA':'OPS-Misc. Hotel Supplier','211109',l.reserve,'Staff error reserve'); }
  if(r.C.ae) add(r.C.ae.code+' '+r.C.ae.name+(r.C.ae.person?' ('+r.C.ae.person+')':''),r.C.ae.payGL||'211109',r.T.ae,'AE / employee');
  add(r.C.settings.card,'211109',r.T.cc,'Card acquirer'); add('UCPB GEN','211101',r.T.ipp,'Pass-through'); add('DIP-UCPB','211109',r.T.dte,'Pass-through'); add('ACWT','211109',r.T.pwt,'Tax'); add('SOS001 Various Supplier','211109',r.T.adm,'Admin fee');
  const rows=[...grp.values()];
  return `<div class="card"><div class="card-h"><h2>Who gets paid from this statement</h2><span class="muted">From its sales journal</span></div><div class="tw"><table class="t"><thead><tr><th>Payee</th><th>Type</th><th>GL</th><th class="r">Amount</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.who)}</td><td>${x.what}</td><td class="mono">${x.gl}</td><td class="r">${m(x.amt)}</td></tr>`).join('')}<tr class="grp"><td>North Star accrued income</td><td>Income</td><td class="mono">211201</td><td class="r">${m(r.T.accrued)}</td></tr></tbody><tfoot><tr><td colspan="3">Total credits</td><td class="r">${m(rows.reduce((a,x)=>a+x.amt,0)+r.T.accrued)}</td></tr></tfoot></table></div></div>`;
}
function docsHTML(bs,so,r){
  const C=r.C, si=C.si;
  const bsRows=r.lines.map(l=>[l.desc||PRODUCTS[l.product],bs.ccMode==='imputed'?l.billed:l.sp]);
  if(bs.ccMode==='separate'&&r.T.cc) bsRows.push(['Other miscellaneous fees (credit card surcharge)',r.T.cc]);
  return `<div class="doc"><h3>Billing statement ${esc(bs.no)}</h3><div class="muted">Reimbursable costs · Sales order ${esc(so.no)}</div><div class="meta"><div><b>${esc(C.client.name)}</b><br>${esc(C.client.code)}</div><div>${esc(bs.no)}<br>${esc(bs.date)}</div></div>
   <table class="t"><thead><tr><th>Description</th><th class="r">Amount</th></tr></thead><tbody>${bsRows.map(([d,a])=>`<tr><td>${esc(d)}</td><td class="r">${m(a)}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total due</td><td class="r">${P(r.T.bs)}</td></tr></tfoot></table></div>
  ${si?`<div class="doc"><h3>Service invoice ${esc(si.no)}</h3><div class="muted">VAT invoice · companion to ${esc(bs.no)}</div><div class="meta"><div><b>${esc(C.client.name)}</b><br>${esc(C.client.code)}</div><div>${esc(si.no)}<br>${esc(si.date)}</div></div>
   <table class="t"><thead><tr><th>Description</th><th class="r">Amount</th></tr></thead><tbody>${r.fees.map(f=>`<tr><td>${SF_TYPES[f.type]}</td><td class="r">${m(f.billed)}</td></tr>`).join('')}
   <tr><td class="muted">VATable sales</td><td class="r muted">${m(r.fees.reduce((a,f)=>a+f.net,0))}</td></tr><tr><td class="muted">VAT ${C.settings.vat}%</td><td class="r muted">${m(r.fees.reduce((a,f)=>a+f.vat,0))}</td></tr>
   ${C.client.twa?`<tr><td class="muted">Less ${C.settings.ewt}% withholding tax</td><td class="r muted">(${m(r.T.ewt)})</td></tr>`:''}</tbody><tfoot><tr><td>Amount due</td><td class="r">${P(r.T.si-r.T.ewt)}</td></tr></tfoot></table></div>`:`<div class="doc"><h3>Service invoice</h3><p class="muted" style="margin:0">No companion service invoice for ${esc(bs.no)}.</p></div>`}`;
}

/* ---------- billing statement form ---------- */
function nextNo(kind){ DB.seq[kind]=(DB.seq[kind]||0)+1; return ({so:'SO',bs:'BS',si:'SI'})[kind]+'-2026-'+String(DB.seq[kind]).padStart(4,'0'); }
function bsForm(id,soIdParam){
  const orig=id?bsById(id):null;
  if(orig&&orig.status==='posted'){ toast('Posted statements are locked. Return it to draft first.'); location.hash='#/statements/'+id; return; }
  const bs=orig?JSON.parse(JSON.stringify(orig)):{id:uid(),no:'',soId:soIdParam||'',date:today(),payment:'card',ccMode:'separate',status:'draft',notes:'',lines:[],rebaters:[]};
  const origSI=orig?siOf(orig):null;
  const si=origSI?JSON.parse(JSON.stringify(origSI)):{id:uid(),no:'',bsId:bs.id,date:bs.date,fees:[]};
  let hasSI=!!origSI || (!orig);
  if(!orig && !si.fees.length) si.fees.push({id:uid(),type:'sf_air_intl',amount:0});
  if(!orig && bs.soId){ const so=soById(bs.soId); if(so){ const cl=client(so.clientCode); bs.rebaters=DB.rebaters.filter(r=>r.clientCode===so.clientCode).map(r=>r.code); } }
  const soOpts=()=>`<option value="">Select a sales order…</option>`+[...new Set(DB.salesOrders.map(s=>s.clientCode))].map(c=>client(c)).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<optgroup label="${esc(c.name)}">${DB.salesOrders.filter(s=>s.clientCode===c.code).map(s=>`<option value="${s.id}" ${bs.soId===s.id?'selected':''}>${esc(s.no)} · ${MODES[s.mode]} · ${esc(s.route)}</option>`).join('')}</optgroup>`).join('');
  page(`<div class="crumbs"><a href="#/statements">Income distribution</a> / ${orig?esc(orig.no)+' / Edit':'New billing statement'}</div>
  <div class="head"><div><h1>${orig?'Edit '+esc(orig.no):'New billing statement'}</h1><p class="sub">Bill all or part of a sales order. Only the amounts on this statement are distributed, so the same booking is never counted twice.</p></div>
  <div class="btns"><a class="btn" href="${orig?'#/statements/'+orig.id:(bs.soId?'#/orders/'+bs.soId:'#/statements')}">Cancel</a><button class="btn primary" id="bSave">Save draft</button></div></div>
  <div class="card"><div class="card-h"><h2>Sales order and payment</h2></div><div class="card-b grid4">
    <label class="f" style="grid-column:span 2">Sales order<select class="i" id="fSO" ${orig?'disabled':''}>${soOpts()}</select>${orig?'<span class="hint">A statement stays on the sales order it was created for.</span>':''}</label>
    <label class="f">Client<input class="i" id="fClient" readonly></label>
    <label class="f">Account type<input class="i" id="fType" readonly></label>
    <label class="f">AE / employee<input class="i" id="fAE" readonly></label>
    <label class="f">Commission rate<input class="i" id="fRate" readonly></label>
    <label class="f">Withholding agent (TWA)<input class="i" id="fTWA" readonly></label>
    <label class="f">Transaction mode / route<input class="i" id="fMode" readonly></label>
    <label class="f">Statement date<input class="i" type="date" id="fDate" value="${esc(bs.date)}"></label>
    <label class="f">Payment<select class="i" id="fPay"><option value="card" ${bs.payment==='card'?'selected':''}>Credit card (${esc(DB.settings.card)})</option><option value="cash" ${bs.payment==='cash'?'selected':''}>Cash / bank transfer</option></select></label>
    <label class="f">Card surcharge billing<select class="i" id="fCC">${Object.entries(OPT.cc).map(([k,v])=>`<option value="${k}" ${bs.ccMode===k?'selected':''}>${v}</option>`).join('')}</select></label>
    <label class="f">Notes<input class="i" id="fNotes" value="${esc(bs.notes)}" placeholder="Optional"></label>
  </div></div>
  <div class="card"><div class="card-h"><h2>Bill from the sales order</h2><span class="muted" id="soHint"></span></div><div class="tw"><table class="t"><thead><tr><th>Booked line</th><th class="r">Booked selling</th><th class="r">Booked cost</th><th class="r">Pax</th><th class="r">Billed on other statements</th><th class="r">On this statement</th><th class="r">Remaining selling</th><th style="min-width:150px">Progress</th><th></th></tr></thead><tbody id="soBody"></tbody></table></div></div>
  <div class="card"><div class="card-h"><h2>Lines on this statement</h2><button class="btn sm" id="bAddLine" type="button">Add line not on the sales order</button></div>
    <div class="tw"><table class="t edit"><thead><tr><th style="min-width:170px">Product</th><th style="min-width:190px">Supplier</th><th style="min-width:200px">Description</th><th class="r" style="min-width:110px">Selling</th><th class="r" style="min-width:110px">Supplier cost</th><th class="r" style="min-width:110px">PAL base fare</th><th class="r" style="width:70px">Pax</th><th class="r" style="width:76px">Tickets</th><th></th></tr></thead><tbody id="lineBody"></tbody></table></div></div>
  <div class="grid3" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
    <div class="card"><div class="card-h"><h2>Companion service invoice</h2><label class="chk"><input type="checkbox" id="fHasSI" ${hasSI?'checked':''}> Issue ${esc(si.no||'a new SI')}</label></div><div id="siBox"></div></div>
    <div class="card"><div class="card-h"><h2>Rebaters</h2><span class="muted" id="rebHint"></span></div><div class="card-b" id="rebBox"></div></div>
  </div>
  <div class="card"><div class="card-h"><h2>Preview – this statement only</h2><span class="muted">Not saved until you click Save draft</span></div><div class="card-b" id="preview"></div></div>`);
  const prodOpts=v=>Object.entries(PRODUCTS).map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('');
  const supOpts=(p,v)=>{ const kind=p.startsWith('air')?'air':p.startsWith('hotel')?'hotel':p; return `<option value="">Select…</option>`+DB.suppliers.filter(s=>s.product===kind).map(s=>`<option value="${s.code}" ${v===s.code?'selected':''}>${esc(s.name)}</option>`).join(''); };
  const drawSO=()=>{
    const so=soById(bs.soId);
    if(!so){ $('soBody').innerHTML='<tr><td colspan="9" class="muted">Pick a sales order to see its booked lines.</td></tr>'; $('soHint').textContent=''; return; }
    $('soHint').textContent=`${so.no} · ${so.pax||'—'} pax booked · ${bsOfSO(so.id).filter(b=>b.id!==bs.id).length} other statement(s)`;
    $('soBody').innerHTML=so.lines.map(sl=>{
      const others={sp:0,cost:0,pax:0}; for(const b of DB.billingStatements) if(b.id!==bs.id) for(const l of b.lines) if(l.soLineId===sl.id){ others.sp+=+l.sp||0; others.cost+=+l.cost||0; others.pax+=+l.pax||0; }
      const here=bs.lines.filter(l=>l.soLineId===sl.id).reduce((a,l)=>a+(+l.sp||0),0);
      const rem=sl.sp-others.sp-here; const pctO=Math.min(100,others.sp/sl.sp*100), pctH=Math.min(100-pctO,here/sl.sp*100);
      return `<tr><td><b>${esc(sl.desc||PRODUCTS[sl.product])}</b><div class="muted">${PRODUCTS[sl.product]} · ${esc((supplier(sl.supplier)||{}).short||'')}</div></td><td class="r">${m(sl.sp)}</td><td class="r">${m(sl.cost)}</td><td class="r">${sl.pax}</td><td class="r">${m(others.sp)}</td><td class="r">${m(here)}</td><td class="r ${rem<-0.004?'neg':''}"><b>${m(rem)}</b></td>
        <td><div class="bar" style="height:8px"><span style="width:${pctO}%;background:var(--c-pass)"></span><span style="width:${pctH}%;background:var(--accent)"></span></div></td>
        <td class="r">${rem>0.004?`<button class="btn sm" type="button" data-addrem="${sl.id}">Add remaining</button>`:'<span class="muted">Fully billed</span>'}</td></tr>`;
    }).join('');
  };
  const drawLines=()=>{
    $('lineBody').innerHTML=bs.lines.length?bs.lines.map((l,i)=>`<tr data-i="${i}"><td><select class="i" data-k="product" ${l.soLineId?'disabled':''}>${prodOpts(l.product)}</select>${l.soLineId?'<div class="muted" style="font-size:12px;margin-top:3px">From sales order</div>':''}</td><td><select class="i" data-k="supplier" ${l.soLineId?'disabled':''}>${supOpts(l.product,l.supplier)}</select></td><td><input class="i" data-k="desc" value="${esc(l.desc)}" placeholder="Route, hotel, passenger…"></td>
      <td><input class="i num" type="number" step="0.01" data-k="sp" value="${l.sp||''}"></td><td><input class="i num" type="number" step="0.01" data-k="cost" value="${l.cost||''}"></td>
      <td><input class="i num" type="number" step="0.01" data-k="baseFare" value="${l.baseFare||''}" ${(supplier(l.supplier)||{}).isPAL?'':'disabled placeholder="PAL only"'}></td>
      <td><input class="i num" type="number" min="0" data-k="pax" value="${l.pax}"></td><td><input class="i num" type="number" min="0" data-k="tickets" value="${l.tickets}" ${l.product.startsWith('air')?'':'disabled'}></td>
      <td><button class="btn sm danger" type="button" data-del="${i}" aria-label="Remove line">✕</button></td></tr>`).join(''):`<tr><td colspan="9" class="muted">No lines yet. Use “Add remaining” above to bill a sales-order line, then reduce the amounts for a partial bill.</td></tr>`;
  };
  const drawSI=()=>{
    if(!hasSI){ $('siBox').innerHTML='<div class="card-b muted">No companion service invoice. The AE gets no service-fee entitlement on this statement.</div>'; return; }
    $('siBox').innerHTML=`<div class="tw"><table class="t edit"><thead><tr><th>Fee</th><th class="r">Amount incl. VAT</th><th></th></tr></thead><tbody>${si.fees.map((f,i)=>`<tr data-i="${i}"><td><select class="i" data-k="type">${Object.entries(SF_TYPES).map(([k,v])=>`<option value="${k}" ${f.type===k?'selected':''}>${v}</option>`).join('')}</select></td><td><input class="i num" type="number" step="0.01" data-k="amount" value="${f.amount||''}"></td><td><button class="btn sm danger" type="button" data-del="${i}" aria-label="Remove fee">✕</button></td></tr>`).join('')}</tbody></table></div><div class="card-b" style="padding-top:8px"><button class="btn sm" type="button" id="bAddFee">Add fee</button></div>`;
    $('bAddFee').onclick=()=>{ si.fees.push({id:uid(),type:'sf_air_intl',amount:0}); drawSI(); };
  };
  const drawReb=()=>{
    const so=soById(bs.soId); const code=so?so.clientCode:'';
    const list=DB.rebaters.filter(r=>r.clientCode===code);
    bs.rebaters=bs.rebaters.filter(c=>list.some(r=>r.code===c));
    $('rebHint').textContent=code?(list.length?'Linked to this client':''):'Pick a sales order first';
    $('rebBox').innerHTML=list.length?list.map(r=>`<label class="chk" style="margin-bottom:6px"><input type="checkbox" value="${r.code}" ${bs.rebaters.includes(r.code)?'checked':''}> <span><b>${esc(r.code)}</b> ${esc(r.name)} <span class="muted">· ${r.currency==='USD'?'$':'₱'}${r.amount} per ${r.unit==='intl'?'intl':'domestic'} ticket</span></span></label>`).join(''):`<p class="muted" style="margin:0">${code?'This client has no rebaters.':'—'}</p>`;
    $('rebBox').querySelectorAll('input').forEach(cb=>cb.onchange=()=>{ bs.rebaters=[...$('rebBox').querySelectorAll('input:checked')].map(x=>x.value); preview(); });
  };
  const head=()=>{
    const so=soById(bs.soId); const cl=so?client(so.clientCode):null; const rule=cl?by(DB.rules,'type',cl.type):null; const ae=cl?aeOf(cl.ae):null;
    $('fClient').value=cl?`${cl.code} ${cl.name}`:''; $('fType').value=cl?TYPE_LABEL[cl.type]:''; $('fAE').value=ae?`${ae.code} ${ae.name}${ae.person?' ('+ae.person+')':''}`:(cl?'None':'');
    $('fTWA').value=cl?(cl.twa?'Yes – 2% withheld':'No'):''; $('fRate').value=cl?((ae&&ae.rateOverride!==''?ae.rateOverride:rule.rate)+'%'):''; $('fMode').value=so?`${MODES[so.mode]} · ${so.route}`:'';
    $('fCC').disabled=bs.payment!=='card';
  };
  // temporary SI attached for preview
  const previewBS=()=>({...bs,status:'draft'});
  const withTempSI=(fn)=>{ const saved=DB.serviceInvoices; DB.serviceInvoices=saved.filter(x=>x.bsId!==bs.id).concat(hasSI?[{...si,bsId:bs.id,no:si.no||'(new SI)'}]:[]); try{ return fn(); } finally{ DB.serviceInvoices=saved; } };
  const preview=()=>{
    drawSO();
    if(!bs.soId){ $('preview').innerHTML='<p class="muted" style="margin:0">Pick a sales order to see the distribution.</p>'; return; }
    if(!bs.lines.length){ $('preview').innerHTML='<p class="muted" style="margin:0">Add at least one line.</p>'; return; }
    if(bs.lines.some(l=>!l.supplier)){ $('preview').innerHTML='<p class="muted" style="margin:0">Pick a supplier on every line to see the distribution.</p>'; return; }
    const r=withTempSI(()=>compute(previewBS())); const ob=overbillWarnings(bs);
    $('preview').innerHTML=`${[...r.warn,...ob].map(w=>`<div class="alert warn">${esc(w)}</div>`).join('')}<div class="kpis" style="margin-bottom:12px">
      <div class="kpi"><b>${P(r.T.bs)}</b><small>This billing statement</small></div><div class="kpi"><b>${P(r.T.gm)}</b><small>Gross margin</small></div>
      <div class="kpi"><b>${P(r.T.ae)}</b><small><i style="background:var(--c-ae)"></i>AE income</small></div><div class="kpi"><b>${P(r.T.reserve)}</b><small><i style="background:var(--c-res)"></i>Staff error</small></div><div class="kpi"><b>${P(r.T.accrued)}</b><small><i style="background:var(--c-ns)"></i>North Star income</small></div></div>
      ${r.je.every(j=>j.ok)?'<span class="tag posted">All journal entries balance</span>':'<span class="tag bad">A journal entry does not balance</span>'}`;
  };
  drawLines(); drawSI(); drawReb(); head(); preview();
  $('fSO').onchange=e=>{ bs.soId=e.target.value; bs.lines=bs.lines.filter(l=>!l.soLineId); const so=soById(bs.soId); bs.rebaters=so?DB.rebaters.filter(r=>r.clientCode===so.clientCode).map(r=>r.code):[]; head(); drawReb(); drawLines(); preview(); };
  $('fPay').onchange=e=>{ bs.payment=e.target.value; head(); preview(); };
  $('fCC').onchange=e=>{ bs.ccMode=e.target.value; preview(); };
  $('fDate').onchange=e=>{ bs.date=e.target.value; if(!si.no) si.date=bs.date; };
  $('fNotes').oninput=e=>bs.notes=e.target.value;
  $('fHasSI').onchange=e=>{ hasSI=e.target.checked; if(hasSI&&!si.fees.length) si.fees.push({id:uid(),type:'sf_air_intl',amount:0}); drawSI(); preview(); };
  $('soBody').addEventListener('click',e=>{ const b=e.target.closest('[data-addrem]'); if(!b) return; const so=soById(bs.soId); const sl=so.lines.find(x=>x.id===b.dataset.addrem);
    const o={sp:0,cost:0,pax:0,tickets:0,base:0}; for(const x of DB.billingStatements) if(x.id!==bs.id) for(const l of x.lines) if(l.soLineId===sl.id){ o.sp+=+l.sp||0; o.cost+=+l.cost||0; o.pax+=+l.pax||0; o.tickets+=+l.tickets||0; o.base+=+l.baseFare||0; }
    for(const l of bs.lines) if(l.soLineId===sl.id){ o.sp+=+l.sp||0; o.cost+=+l.cost||0; o.pax+=+l.pax||0; o.tickets+=+l.tickets||0; o.base+=+l.baseFare||0; }
    bs.lines.push({id:uid(),soLineId:sl.id,product:sl.product,supplier:sl.supplier,desc:sl.desc,sp:r2(sl.sp-o.sp),cost:r2(sl.cost-o.cost),baseFare:r2(Math.max(0,sl.baseFare-o.base)),pax:Math.max(0,sl.pax-o.pax),tickets:Math.max(0,sl.tickets-o.tickets)});
    drawLines(); preview(); });
  $('lineBody').addEventListener('input',e=>{ const tr=e.target.closest('tr'); const k=e.target.dataset.k; if(!tr||!k) return; const l=bs.lines[+tr.dataset.i]; l[k]=e.target.type==='number'?(+e.target.value||0):e.target.value;
    if(k==='product'){ l.supplier=''; if(!l.product.startsWith('air')) l.tickets=0; else if(!l.tickets) l.tickets=l.pax||1; drawLines(); }
    if(k==='supplier'){ if(!(supplier(l.supplier)||{}).isPAL) l.baseFare=0; drawLines(); }
    preview(); });
  $('lineBody').addEventListener('click',e=>{ const b=e.target.closest('[data-del]'); if(!b) return; bs.lines.splice(+b.dataset.del,1); drawLines(); preview(); });
  $('bAddLine').onclick=()=>{ bs.lines.push({id:uid(),soLineId:null,product:'air_intl',supplier:'',desc:'',sp:0,cost:0,baseFare:0,pax:1,tickets:1}); drawLines(); };
  $('siBox').addEventListener('input',e=>{ const tr=e.target.closest('tr'); const k=e.target.dataset.k; if(!tr||!k) return; si.fees[+tr.dataset.i][k]=e.target.type==='number'?(+e.target.value||0):e.target.value; preview(); });
  $('siBox').addEventListener('click',e=>{ const b=e.target.closest('[data-del]'); if(!b) return; si.fees.splice(+b.dataset.del,1); drawSI(); preview(); });
  $('bSave').onclick=()=>{
    if(!bs.soId){ toast('Pick a sales order before saving'); $('fSO').focus(); return; }
    if(!bs.lines.length){ toast('Add at least one line'); return; }
    const miss=bs.lines.findIndex(l=>!l.supplier); if(miss>=0){ toast(`Line ${miss+1} needs a supplier`); return; }
    const ob=overbillWarnings(bs); if(ob.length && !confirm(ob.join('\n')+'\n\nSave anyway?')) return;
    if(!orig){ bs.no=nextNo('bs'); DB.billingStatements.push(bs); } else Object.assign(orig,bs);
    const target=orig||bs;
    DB.serviceInvoices=DB.serviceInvoices.filter(x=>x.bsId!==target.id);
    if(hasSI && si.fees.some(f=>+f.amount)){ if(!si.no) si.no=nextNo('si'); si.bsId=target.id; si.date=si.date||target.date; si.fees=si.fees.filter(f=>+f.amount); DB.serviceInvoices.push(si); }
    save(); toast((orig?'Saved ':'Created ')+target.no+(hasSI&&si.no?' with '+si.no:'')); location.hash='#/statements/'+target.id;
  };
}

/* ======================= SALES ORDERS ======================= */
function soStats(so){
  const list=bsOfSO(so.id).map(bs=>({bs,r:compute(bs)}));
  const booked=so.lines.reduce((a,l)=>a+(+l.sp||0),0);
  const billed=list.reduce((a,x)=>a+x.bs.lines.filter(l=>l.soLineId).reduce((s,l)=>s+(+l.sp||0),0),0);
  return {list,booked,billed,ae:list.reduce((a,x)=>a+x.r.T.ae,0),ns:list.reduce((a,x)=>a+x.r.T.accrued,0)};
}
function soList(){
  page(`<div class="head"><div><h1>Sales orders</h1><p class="sub">A sales order is the booking. It is billed through one or more billing statements; income is distributed on the statements, not here.</p></div><div class="btns"><a class="btn primary" href="#/orders/new">New sales order</a></div></div>
  ${hierarchy()}
  <div class="card"><div class="tw"><table class="t nw"><thead><tr><th>Sales order</th><th>Date</th><th>Client</th><th>Account</th><th>Mode</th><th>Package type</th><th>Route</th><th class="r">Pax</th><th class="r">Booked selling</th><th class="r">Billed to date</th><th style="min-width:120px">Billed</th><th>Statements</th><th class="r">AE income</th><th class="r">North Star income</th></tr></thead><tbody>
  ${DB.salesOrders.slice().sort((a,b)=>b.no.localeCompare(a.no)).map(so=>{ const s=soStats(so); const cl=client(so.clientCode)||{}; const pct=s.booked?Math.min(100,s.billed/s.booked*100):0;
    return `<tr class="click" data-id="${so.id}"><td style="white-space:nowrap"><b>${esc(so.no)}</b></td><td style="white-space:nowrap">${esc(so.date)}</td><td>${esc(cl.name)}<div class="muted mono">${esc(cl.code)}</div></td><td>${typeTag(cl.type)}</td><td>${modeTag(so.mode)}</td><td>${esc(so.packageType)}</td><td>${esc(so.route)}</td><td class="r">${so.pax}</td><td class="r">${m(s.booked)}</td><td class="r">${m(s.billed)}</td>
    <td><div class="bar" style="height:8px"><span style="width:${pct}%;background:var(--accent)"></span></div><div class="muted" style="font-size:12px">${pct.toFixed(0)}%</div></td><td class="mono" style="font-size:12px">${s.list.map(x=>esc(x.bs.no)).join('<br>')||'<span class="muted">None yet</span>'}</td><td class="r">${m(s.ae)}</td><td class="r"><b>${m(s.ns)}</b></td></tr>`; }).join('')}
  </tbody></table></div></div>
  <p class="muted">AE and North Star income are the sum of each sales order's billing statements.</p>`);
  document.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>location.hash='#/orders/'+tr.dataset.id);
}
function soView(id){
  const so=soById(id); if(!so){ page('<div class="empty">That sales order no longer exists. <a href="#/orders">Back to sales orders</a></div>'); return; }
  const cl=client(so.clientCode)||{}; const s=soStats(so);
  page(`<div class="crumbs"><a href="#/orders">Sales orders</a> / <a href="#/clients-summary/${encodeURIComponent(cl.code)}">${esc(cl.name)}</a> / ${esc(so.no)}</div>
  <div class="head"><div><h1>${esc(so.no)}</h1><p class="sub">${esc(cl.name)} · ${typeTag(cl.type)} · ${MODES[so.mode]} · ${esc(so.route)}</p></div>
  <div class="btns"><a class="btn" href="#/orders/${so.id}/edit">Edit sales order</a>${s.list.length?'':'<button class="btn danger" id="soDel">Delete</button>'}<a class="btn primary" href="#/statements/new/${so.id}">New billing statement</a></div></div>
  <div class="card"><div class="card-b kv">
    <div><small>Client</small><b>${esc(cl.code)}</b></div><div><small>Transaction mode</small><b>${MODES[so.mode]}</b></div><div><small>Package type</small><b>${esc(so.packageType)}</b></div><div><small>Route</small><b>${esc(so.route)}</b></div>
    <div><small>Pax booked</small><b>${so.pax}</b></div><div><small>Date</small><b>${esc(so.date)}</b></div><div><small>Booked selling</small><b>${P(s.booked)}</b></div><div><small>Billed to date</small><b>${P(s.billed)}</b></div>
  </div>${so.notes?`<div class="card-b muted" style="border-top:1px solid var(--rule-2)">${esc(so.notes)}</div>`:''}</div>
  <div class="card"><div class="card-h"><h2>Booked lines and what has been billed</h2><span class="muted">Each statement bills only its own portion</span></div><div class="tw"><table class="t"><thead><tr><th>Booked line</th><th class="r">Selling</th><th class="r">Cost</th><th class="r">Pax</th><th class="r">Tickets</th>${s.list.map(x=>`<th class="r">${esc(x.bs.no)}</th>`).join('')}<th class="r">Billed total</th><th class="r">Remaining</th></tr></thead><tbody>

  };
}

function journalPage(){
  const posted=DB.billingStatements.filter(b=>b.status==='posted');
  const rows=[]; for(const b of posted){ const r=compute(b); for(const j of r.je) for(const x of j.lines) rows.push({bs:b,doc:j.doc,date:b.date,entry:j.title,...x}); }
  const tb=new Map(); for(const x of rows){ const e=tb.get(x.gl)||{gl:x.gl,dr:0,cr:0}; e.dr+=x.dr||0; e.cr+=x.cr||0; tb.set(x.gl,e); }
  const tbr=[...tb.values()].sort((a,b)=>a.gl.localeCompare(b.gl));
  const sdr=tbr.reduce((a,x)=>a+x.dr,0), scr=tbr.reduce((a,x)=>a+x.cr,0);
  page(`<div class="head"><div><h1>General journal</h1><p class="sub">Entries from ${posted.length} posted billing statement${posted.length===1?'':'s'} and their companion service invoices. Each entry belongs to one statement; drafts are not included.</p></div></div>
  <div class="card"><div class="card-h"><h2>Trial balance</h2>${Math.abs(sdr-scr)<0.02?'<span class="tag posted">Balanced</span>':'<span class="tag bad">Out of balance</span>'}</div><div class="tw"><table class="t"><thead><tr><th>GL</th><th>Account</th><th class="r">Debit</th><th class="r">Credit</th><th class="r">Balance</th></tr></thead><tbody>
  ${tbr.map(x=>`<tr><td class="mono">${x.gl}</td><td>${esc(glName(x.gl))}</td><td class="r">${m(x.dr)}</td><td class="r">${m(x.cr)}</td><td class="r">${m(x.dr-x.cr)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Post a billing statement to see balances.</td></tr>'}
  </tbody><tfoot><tr><td colspan="2">Total</td><td class="r">${m(sdr)}</td><td class="r">${m(scr)}</td><td></td></tr></tfoot></table></div></div>
  <div class="card"><div class="card-h"><h2>Journal lines</h2><div class="btns"><select class="i" id="jbs" style="width:auto"><option value="">All statements</option>${posted.map(b=>`<option value="${b.id}">${esc(b.no)}</option>`).join('')}</select><select class="i" id="jgl" style="width:auto"><option value="">All accounts</option>${tbr.map(x=>`<option value="${x.gl}">${x.gl} ${esc(glName(x.gl))}</option>`).join('')}</select></div></div><div class="tw"><table class="t"><thead><tr><th>Date</th><th>Statement</th><th>Document</th><th>Entry</th><th>GL</th><th>Subsidiary ledger</th><th class="r">Debit</th><th class="r">Credit</th></tr></thead><tbody id="jbody"></tbody></table></div></div>`);
  const draw=()=>{ const g=$('jgl').value, b=$('jbs').value; $('jbody').innerHTML=rows.filter(x=>(!g||x.gl===g)&&(!b||x.bs.id===b)).map(x=>`<tr><td>${esc(x.date)}</td><td><a href="#/statements/${x.bs.id}">${esc(x.bs.no)}</a></td><td class="mono">${esc(x.doc)}</td><td class="muted">${esc(x.entry)}</td><td class="mono">${x.gl}</td><td>${esc(x.sl)}</td><td class="r">${x.dr?m(x.dr):''}</td><td class="r">${x.cr?m(x.cr):''}</td></tr>`).join(''); };
  $('jgl').onchange=draw; $('jbs').onchange=draw; draw();
}

function editRecord(name,key){
  const S=SCHEMAS[name]; const data=DB[name]; const rec=key!=null?data.find(x=>String(x[S.key])===String(key)):null;
  const v=rec?{...rec}:{};
  const used = name==='clients'&&rec ? DB.salesOrders.some(s=>s.clientCode===rec.code) : name==='suppliers'&&rec ? (DB.salesOrders.some(s=>s.lines.some(l=>l.supplier===rec.code))||DB.billingStatements.some(b=>b.lines.some(l=>l.supplier===rec.code))) : name==='aes'&&rec ? DB.clients.some(c=>c.ae===rec.code) : false;
  const d=$('dlg');
  d.innerHTML=`<form method="dialog" id="rf"><div class="dh"><b>${rec?'Edit':'Add'} ${S.title.toLowerCase().replace(/s$/,'')}</b><button class="btn sm" value="cancel" type="submit" aria-label="Close">✕</button></div><div class="db">
  ${S.fields.map(f=>{ const val=v[f.k]??''; const cls=f.full||f.type==='check'?'full':''; 
    if(f.type==='check') return `<label class="chk ${cls}"><input type="checkbox" name="${f.k}" ${val?'checked':''}> ${f.l}</label>`;
    if(f.type==='select') return `<label class="f ${cls}">${f.l}<select class="i" name="${f.k}">${Object.entries(f.opts()).map(([k,l])=>`<option value="${esc(k)}" ${String(val)===String(k)?'selected':''}>${esc(l)}</option>`).join('')}</select>${f.hint?`<span class="hint">${f.hint}</span>`:''}</label>`;
    return `<label class="f ${cls}">${f.l}<input class="i" name="${f.k}" ${f.type==='number'?'type="number" step="any"':''} value="${esc(val)}" ${name==='rules'&&f.k==='label'?'readonly':''} ${f.k===S.key&&rec&&used?'readonly':''}>${f.hint?`<span class="hint">${f.hint}</span>`:''}</label>`; }).join('')}
  </div><div class="df">${rec&&!S.noAdd?`<button class="btn danger" type="button" id="rDel" ${used?'disabled title="In use"':''} style="margin-right:auto">${used?'In use – can\u2019t delete':'Delete'}</button>`:''}<button class="btn" value="cancel" type="submit">Cancel</button><button class="btn primary" type="button" id="rSave">Save</button></div></form>`;
  d.showModal();
  $('rSave').onclick=()=>{
    const fd=new FormData($('rf')); const out={...v};
    for(const f of S.fields){ if(f.type==='check') out[f.k]=fd.has(f.k); else if(f.type==='number'){ const x=fd.get(f.k); out[f.k]= x===''?'':+x; } else out[f.k]=(fd.get(f.k)??'').toString().trim(); }
    if(!out[S.key]&&S.key!=='type'){ toast('Fill in the '+S.fields[0].l.toLowerCase()); return; }
    if(!rec && data.some(x=>x[S.key]===out[S.key])){ toast('That code already exists'); return; }
    if(rec) Object.assign(rec,out); else data.push(out);
    save(); d.close(); toast('Saved'); route();
  };
  if($('rDel')) $('rDel').onclick=()=>{ if(!confirm('Delete this record?')) return; DB[name]=data.filter(x=>x!==rec); save(); d.close(); toast('Deleted'); route(); };
}

/* readable per-line breakdown built from the engine's own line results */
function lineBreakdown(l,C){
  const R=C.rule, rows=[];
  const add=(label,v,kind,tip)=>rows.push({label,v,kind,tip});
  add(l.ccDed?'Selling price (incl. card surcharge)':'Selling price',l.ccDed?l.billed:l.sp,'');
  add('Supplier cost',-l.cost,'');
  add('Gross margin',l.gm,'sub',TIP.gm);
  const less=[];
  if(l.ccDed) less.push(['Card surcharge',l.ccDed]);
  if(l.ipp) less.push(['IPP',l.ipp,TIP.ipp]);
  const dteM=l.dte-l.dteA; if(dteM) less.push(['DTE',dteM,TIP.dte]);
  const admM=l.admCharged-l.admAE; if(admM) less.push(['Admin fee',admM,TIP.adm]);
  const rebM=R.rebate==='margin'?l.rebT:0; if(rebM) less.push(['Rebates',rebM,TIP.reb]);
  if(l.pwt) less.push(['Supplier CWT',l.pwt,TIP.cwt]);
  if(less.length){ rows.push({label:'Less:',kind:'hd'}); less.forEach(([a,v,t])=>add(a,-v,'ind',t)); add('Net margin',l.nm,'sub',TIP.nm); }
  if(!l.comm){ add('Non-commissionable – all margin stays with North Star',null,'note'); add('North Star final',l.accrued,'ns',TIP.ns); return rows; }
  add('Less VAT',-l.vat,'',TIP.vat);
  add('Net distributable margin',l.ndm,'sub',TIP.ndm);
  if(l.placeholder){ add('Domestic is non-commissionable for this AE (₱0.01 sales-report marker)',l.placeholder,'note'); }
  else if(C.rate>0){
    const pct=!l.intl&&R.domestic==='full'?100:C.rate;
    add(`AE share (${pct}%)`,l.share,'',TIP.ae);
    if(l.sfShare) add('+ Service fee entitlement',l.sfShare,'',TIP.sfe);
    if(l.rebAE) add('Less rebates (paid by the AE)',-l.rebAE,'',TIP.reb);
    if(l.admAE) add('Less admin fee (paid by the AE)',-l.admAE,'');
  }
  add('AE income',l.aeNet,'ae',TIP.ae);
  add('North Star share',l.ns,'',TIP.ns+' Net margin less the AE share; includes the VAT portion.');
  if(l.reserve) add('Less staff error reserve',-l.reserve,'',TIP.res);
  if(l.dteA) add('Less DTE',-l.dteA,'',TIP.dte);
  add('North Star final',l.accrued,'ns',TIP.ns);
  return rows;
}

  if(domFull){
    const pax=paxOf(bs.lines)||1; const dsf=r.fees.filter(f=>f.type==='sf_air_dom').reduce((a,f)=>a+(+f.amount||0),0); const per=dsf/pax;
    const vatKept=r.lines.reduce((a,l)=>a+l.vat,0), toAE=r.lines.reduce((a,l)=>a+l.aeNet,0);
    special=`<div class="method-card"><div class="method-tag">Different method</div><h2>Domestic A La Carte</h2>
      <div class="method-grid"><div><small>North Star keeps</small><b>${dsf?`${P(per)} × ${pax} pax = ${P(dsf)}`:'—'}</b><span>the domestic service fee${r.C.si?' on '+esc(r.C.si.no):''}, plus the VAT portion of the margin (${P(vatKept)})</span></div>
      <div class="method-arrow">→</div><div><small>Remaining distributable amount</small><b>${P(toAE)}</b><span>goes to the AE</span></div></div>
      <p class="method-foot">No percentage split after this point.</p></div>`;
  }
  return `${explain(`Calculated for <b>${esc(bs.no)}</b> only.`+(list.length>1?' Switch statements above to see each one\u2019s own result.':''))}
  ${special}
  ${friendlyWarnings(r,demoConfigNotes(C))}
  <div class="bd-grid">${r.lines.map(l=>`<div class="card bd-card"><div class="card-h"><div><h2>${esc(PRODUCTS[l.product])}</h2><span class="muted">${esc(l.desc||'')}${l.pax?' · '+l.pax+' pax':''}</span></div>${l.comm?'':'<span class="tag draft">Non-commissionable</span>'}</div><div class="card-b">${ledger(lineBreakdown(l,C))}</div></div>`).join('')}</div>
  ${siCard(bs,r)}
  <div class="detail-wrap"><button class="btn" id="detToggle" type="button" aria-expanded="${demoShowDetail}" aria-controls="detBox">${demoShowDetail?'Hide':'Show'} detailed calculation</button>
  <div id="detBox" ${demoShowDetail?'':'hidden'}>${distHTML(r)}</div></div>`;
}
function demoStep4({so,list,bs,cl,r},link){
  const C=r.C, T=r.T, ext=C.client.type==='ext';
  const aeName=C.ae?(C.ae.person||C.ae.name):'No AE (house account)';
  const total=Math.max(0.01,T.ae+T.accrued);
  const adj=[];
  if(T.sfEnt>0.004) adj.push(['Service fee entitlement (included in AE)',T.sfEnt,TIP.sfe]);
  if(T.reb>0.004) adj.push([`Rebates (${C.rule.rebate==='ae'?'paid out of the AE share':'paid out of the margin'})`,T.reb,TIP.reb]);
  if(T.reserve>0.004) adj.push(['Staff error reserve (held back from North Star)',T.reserve,TIP.res]);
  if(T.adm>0.004) adj.push(['Admin fee',T.adm,TIP.adm]);
  const aeGross=r.lines.reduce((a,l)=>a+l.aeGross+l.placeholder,0), rebAE=r.lines.reduce((a,l)=>a+l.rebAE,0), admAE=r.lines.reduce((a,l)=>a+l.admAE,0);
  return `<div class="result-hd"><h2>Income Distribution Result</h2><span class="muted">${esc(bs.no)} · ${esc(cl.name)}</span></div>
  <div class="result-cards">
    <div class="rc rc-ae"><small>AE / Employee ${info(TIP.ae)}</small><b>${P(T.ae)}</b><span>${esc(aeName)}</span></div>
    <div class="rc rc-ns"><small>North Star ${info(TIP.ns)}</small><b>${P(T.accrued)}</b><span>after staff error reserve</span></div>
  </div>
  <div class="result-bar" role="img" aria-label="AE ${(T.ae/total*100).toFixed(0)} percent, North Star ${(T.accrued/total*100).toFixed(0)} percent"><span style="width:${Math.max(0,T.ae)/total*100}%;background:var(--c-ae)">${T.ae/total>0.1?'AE '+(T.ae/total*100).toFixed(0)+'%':''}</span><span style="width:${Math.max(0,T.accrued)/total*100}%;background:var(--c-ns)">${T.accrued/total>0.1?'North Star '+(T.accrued/total*100).toFixed(0)+'%':''}</span></div>
  ${ext?`<div class="card"><div class="card-h"><h2>External AE payout</h2></div><div class="card-b">${ledger([{label:'AE commission',v:aeGross,tip:TIP.ae},...(rebAE?[{label:'Less rebate',v:-rebAE,tip:TIP.reb}]:[]),...(admAE?[{label:'Less admin fee',v:-admAE}]:[]),{label:'AE before EWT',v:T.ae,kind:'ae'}])}<div class="lg-row pending"><span>External EWT</span><b>Pending / Not available</b></div></div></div>`:''}
  ${adj.length?`<div class="card"><div class="card-h"><h2>Adjustments</h2></div><div class="card-b">${adj.map(([a,v,t])=>`<div class="lg-row small"><span>${a} ${info(t)}</span><b>${P(v)}</b></div>`).join('')}</div></div>`:''}
  ${r.C.si?`<div class="card"><div class="card-b"><div class="lg-row small" style="border:0;padding:0"><span>Service fee revenue kept by North Star on ${esc(r.C.si.no)} (net of VAT, less AE entitlement) ${info('Billed on the companion service invoice; not part of the line distribution above.')}</span><b>${P(r.fees.reduce((a,f)=>a+f.net,0)-T.sfEnt)}</b></div></div></div>`:''}
  ${friendlyWarnings({warn:[]},demoConfigNotes(C))}
  ${list.length>1?summaryBlock(so,list,bs,link):''}`;
}
function summaryBlock(so,list,bs,link){
  const rows=list.map(b=>({b,T:compute(b).T}));
  return `<div class="card"><div class="card-h"><h2>Client / Sales Order summary</h2><span class="tag posted">Summary = sum of individual Billing Statement results</span></div><div class="tw"><table class="t demo-t"><thead><tr><th>Billing statement</th><th class="r">Pax</th><th class="r">Billing amount</th><th class="r">AE / Employee</th><th class="r">North Star</th></tr></thead><tbody>
  ${rows.map(({b,T})=>`<tr class="${b.id===bs.id?'cur':''}"><td><a href="${link(4,b.id)}"><b>${esc(b.no)}</b></a>${b.id===bs.id?' <span class="muted">(viewing)</span>':''}</td><td class="r">${paxOf(b.lines)}</td><td class="r">${P(T.bs)}</td><td class="r">${P(T.ae)}</td><td class="r">${P(T.accrued)}</td></tr>`).join('')}
  </tbody><tfoot><tr><td>${esc(so.no)} total</td><td class="r">${rows.reduce((a,x)=>a+paxOf(x.b.lines),0)}</td><td class="r">${P(rows.reduce((a,x)=>a+x.T.bs,0))}</td><td class="r">${P(rows.reduce((a,x)=>a+x.T.ae,0))}</td><td class="r">${P(rows.reduce((a,x)=>a+x.T.accrued,0))}</td></tr></tfoot></table></div></div>`;
}

/* ---------- mode switch ---------- */
let MODE='demo'; try{ MODE=localStorage.getItem('norma-mode')||'demo'; }catch(e){}
function applyMode(){
  document.body.classList.toggle('demo-mode',MODE==='demo');
  document.querySelectorAll('.modesw button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===MODE));
  const links=[...document.querySelectorAll(MODE==='demo'?'#navDemo a':'#navFull a')];
  $('mobsel').innerHTML=links.map(a=>`<option value="${a.getAttribute('href')}" data-nav="${a.dataset.nav}">${a.textContent.trim()}</option>`).join('');
}
function setMode(m){ MODE=m; try{ localStorage.setItem('norma-mode',m); }catch(e){} applyMode(); location.hash = m==='demo'?'#/demo':'#/statements'; route(); }
document.querySelectorAll('.modesw button').forEach(b=>b.onclick=()=>{ if(b.dataset.mode!==MODE) setMode(b.dataset.mode); });
$('navDemo').innerHTML=`<div class="navsec">Client demo</div><a href="#/demo" data-nav="demo">Demo home</a><div class="navsec">Scenarios</div>`+DEMO_SCENARIOS.map(s=>`<a href="#/demo/${s.key}/1" data-nav="demo-${s.key}">${s.title}</a>`).join('');

/* ======================= SETTINGS ======================= */
function settingsPage(){
  const S=DB.settings;
  const F=[['roe','Exchange rate (₱ per USD)'],['ipp','IPP per ticket (USD)'],['dte','DTE per international passenger (USD)'],['adm','Admin (ADM) fee per passenger (USD)'],['cc','Card merchant fee %'],['vat','VAT %'],['ewt','Withholding on service fee %'],['palcwt','Supplier CWT – PAL % of base fare'],['reserve','Staff error reserve %']];
  page(`<div class="head"><div><h1>Fees &amp; rates</h1><p class="sub">Used by every draft billing statement. Posted statements keep the values they were posted with.</p></div><div class="btns"><button class="btn primary" id="sSave">Save changes</button></div></div>
  <div class="card"><div class="card-b grid3">${F.map(([k,l])=>`<label class="f">${l}<input class="i num" type="number" step="any" id="s_${k}" value="${S[k]}"></label>`).join('')}
  <label class="f">Deposit bank account<input class="i" id="s_bank" value="${esc(S.bank)}"></label><label class="f">Card acquirer (payable SL)<input class="i" id="s_card" value="${esc(S.card)}"></label></div></div>
  <div class="card"><div class="card-h"><h2>Demo data</h2></div><div class="card-b"><p class="muted" style="margin-top:0">Everything here is stored in this browser only. Resetting restores the sample clients, AEs, rebaters, suppliers, 8 sales orders, 9 billing statements and their service invoices.</p><button class="btn danger" id="sReset">Reset all data</button></div></div>`);
  $('sSave').onclick=()=>{ for(const [k] of F) S[k]=+$('s_'+k).value; S.bank=$('s_bank').value; S.card=$('s_card').value; save(); toast('Fees and rates saved'); };
  $('sReset').onclick=()=>{ if(!confirm('Reset all data to the samples? Your changes will be lost.')) return; initDB(true); toast('Data reset'); location.hash='#/statements'; };
}

/* theme */
(function(){ let t=null; try{t=localStorage.getItem('idv-theme')}catch(e){} if(t) document.documentElement.setAttribute('data-theme',t);
  $('themeBtn').onclick=()=>{ const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); const nx=cur==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',nx); try{localStorage.setItem('idv-theme',nx)}catch(e){} }; })();

function initDB(force){
  if(!force){ try{ DB=JSON.parse(localStorage.getItem(KEY)); }catch(e){ DB=null; } }
  if(force||!DB||DB.v!==3){ const d=defaultDB(); DB=d.db; for(const id of d.post) postBS(bsById(id)); save(); }
}
initDB();
applyMode();
route();
window.__compute=compute; window.__DB=()=>DB;
window.__test=()=>DB.billingStatements.map(b=>{ const r=compute(b); const acc={}; r.lines.forEach(l=>acc[l.sup.short]=(acc[l.sup.short]||0)+r2(l.accrued)); return [b.no,soOf(b).no,(siOf(b)||{}).no||null,b.status,acc,r2(r.T.ae),r2(r.T.accrued),r.je.map(j=>j.ok)]; });
</script>
